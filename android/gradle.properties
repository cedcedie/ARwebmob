# flutter_embed_unity (Phase 3 AR Lab): values taken verbatim from
# android/unityLibrary/gradle.properties (the exported project's own copy)
# — required because we're not using Unity's provided thin launcher app,
# so these definitions have to exist in our own gradle.properties too.
# Re-copy this whole block from the freshly-exported
# android/unityLibrary/gradle.properties after any future Unity re-export —
# unity.androidNdkPath/unity.androidSdkPath/unity.jdkPath in particular are
# absolute paths into that machine's local Unity Hub install, and buildIl2Cpp
# fails outright ("Could not get unknown property") without them, since
# settings.gradle.kts's :unityLibrary projectDir remap points at the nested
# unityLibrary/unityLibrary module, which never reads the outer wrapper's
# own gradle.properties.
